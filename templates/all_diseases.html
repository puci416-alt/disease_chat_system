<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>全部疾病</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f0f7fc;font-family:Arial;padding:20px;}
        .container{max-width:1000px;margin:0 auto;background:#fff;border-radius:20px;padding:24px 28px;}
        .back{color:#1a7a8a;text-decoration:none;font-size:14px;}
        h1{color:#1a7a8a;font-size:22px;margin:6px 0 4px;}
        .count{color:#6b8a9a;font-size:14px;margin-bottom:12px;}
        .dept-section{margin-bottom:16px;}
        .dept-title{font-size:16px;font-weight:600;color:#1a7a8a;padding:6px 12px;background:#f8fafc;border-radius:8px;border-left:4px solid #1a7a8a;margin-bottom:6px;}
        .tags{display:flex;flex-wrap:wrap;gap:6px;padding-left:10px;}
        .tags a{background:#f8fafc;color:#2c3e50;padding:4px 14px;border-radius:20px;text-decoration:none;font-size:13px;border:1px solid rgba(0,0,0,0.04);}
        .tags a:hover{background:#edf3f8;color:#1a7a8a;}
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back">← 返回</a>
    <h1>📋 全部疾病</h1>
    <p class="count">共 {{ total }} 种疾病</p>
    {% for dept, diseases in depts.items() %}
    <div class="dept-section">
        <div class="dept-title">{{ dept }}（{{ diseases|length }}种）</div>
        <div class="tags">
            {% for d in diseases %}
            <a href="/disease/{{ d }}">{{ d }}</a>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
</body>
</html>
