<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>全部科室</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#f0f7fc; font-family: Arial, sans-serif; padding:20px; }
        .container { max-width:800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px 28px; }
        .back { color:#1a7a8a; text-decoration:none; font-size:14px; }
        h1 { color:#1a7a8a; font-size:22px; margin:6px 0 4px; }
        .count { color:#6b8a9a; font-size:14px; margin-bottom:12px; }
        .grid { display:flex; flex-wrap:wrap; gap:10px; }
        .card { background:#f8fafc; border-radius:12px; padding:12px 20px; border:1px solid rgba(0,0,0,0.04); min-width:140px; text-align:center; }
        .card a { text-decoration:none; color:#1a7a8a; font-weight:600; font-size:15px; }
        .card .num { font-size:12px; color:#6b8a9a; }
        .card:hover { background:#edf3f8; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back">← 返回</a>
    <h1>🏥 全部科室</h1>
    <p class="count">{{ depts|length }} 个科室</p>
    <div class="grid">
        {% for dept, count in depts.items() %}
        <div class="card"><a href="/dept/{{ dept }}">{{ dept }}</a><div class="num">{{ count }} 种疾病</div></div>
        {% endfor %}
    </div>
</div>
</body>
</html>
