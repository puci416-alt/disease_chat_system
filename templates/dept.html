<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ dept_name }} - 在线挂号</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f7fc;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 28px 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .back {
            color: #1a7a8a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 10px;
        }
        .back:hover { color: #0e4a55; }
        h1 { color: #1a7a8a; font-size: 24px; }
        .sub-info { color: #6b8a9a; font-size: 14px; margin-bottom: 18px; }

        .doctor-list { display: flex; flex-direction: column; gap: 14px; }
        .doctor-card {
            background: #f8fafc;
            border-radius: 14px;
            padding: 18px 22px;
            border: 1px solid rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .doctor-card:hover {
            border-color: rgba(26, 122, 138, 0.15);
            background: #edf3f8;
        }
        .doctor-info .name {
            font-size: 17px;
            font-weight: 600;
            color: #1a2a3a;
        }
        .doctor-info .title {
            font-size: 13px;
            color: #6b8a9a;
            margin-top: 2px;
        }
        .doctor-info .tags {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .doctor-info .tags span {
            background: rgba(26, 122, 138, 0.08);
            color: #1a7a8a;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
        }
        .doctor-action {
            text-align: right;
            min-width: 100px;
        }
        .doctor-action .price {
            font-size: 18px;
            font-weight: 700;
            color: #1a7a8a;
        }
        .doctor-action .price small {
            font-size: 12px;
            font-weight: 400;
            color: #6b8a9a;
        }
        .btn-book {
            background: #1a7a8a;
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s;
        }
        .btn-book:hover {
            background: #13606e;
        }
        .btn-book:disabled {
            background: #9ab0c0;
            cursor: not-allowed;
        }

        .popup {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.30);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .popup.show { display: flex; }
        .popup-content {
            background: #fff;
            border-radius: 20px;
            padding: 32px 36px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.10);
        }
        .popup-content h2 { color: #1a7a8a; font-size: 22px; margin-bottom: 6px; }
        .popup-content .sub { color: #6b8a9a; font-size: 14px; margin-bottom: 16px; }
        .popup-content .check-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        .btn-close {
            background: #1a7a8a;
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn-close:hover { background: #13606e; }

        @media (max-width: 600px) {
            .doctor-card { flex-direction: column; align-items: stretch; text-align: center; }
            .doctor-action { text-align: center; margin-top: 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back">← 返回大屏</a>
    <h1>🏥 {{ dept_name }}</h1>
    <p class="sub-info">👇 选择医生，在线挂号</p>

    <div class="doctor-list">
        {% for doctor in doctors %}
        <div class="doctor-card">
            <div class="doctor-info">
                <div class="name">{{ doctor.name }}</div>
                <div class="title">{{ doctor.title }}</div>
                <div class="tags">
                    {% for tag in doctor.tags %}
                    <span>{{ tag }}</span>
                    {% endfor %}
                </div>
            </div>
            <div class="doctor-action">
                <div class="price">{{ doctor.price }}<small> 元</small></div>
                <button class="btn-book" data-doctor="{{ doctor.name }}" data-dept="{{ dept_name }}" data-price="{{ doctor.price }}">
                    立即挂号
                </button>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- 挂号成功弹窗 -->
<div class="popup" id="popup">
    <div class="popup-content">
        <span class="check-icon">✅</span>
        <h2>挂号成功！</h2>
        <p class="sub" id="popup-info">您已成功挂号</p>
        <p style="color:#2c3e50; font-size:14px; margin:10px 0;">请按时就诊，祝您早日康复！</p>
        <button class="btn-close" onclick="closePopup()">我知道了</button>
    </div>
</div>

<script>
    document.querySelectorAll('.btn-book').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var doctor = this.dataset.doctor;
            var dept = this.dataset.dept;
            var price = this.dataset.price;
            document.getElementById('popup-info').textContent = '科室：' + dept + ' | 医生：' + doctor + ' | 费用：' + price + ' 元';
            document.getElementById('popup').classList.add('show');
            this.disabled = true;
            this.textContent = '已挂号';
        });
    });

    function closePopup() {
        document.getElementById('popup').classList.remove('show');
    }
    document.getElementById('popup').addEventListener('click', function(e) {
        if (e.target === this) closePopup();
    });
</script>
</body>
</html>
