<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>附近药店</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f0f7fc;font-family:Arial;padding:20px;}
        .container{max-width:800px;margin:0 auto;background:#fff;border-radius:20px;padding:24px 28px;}
        .back{color:#1a7a8a;text-decoration:none;font-size:14px;}
        h1{color:#1a7a8a;font-size:22px;margin:6px 0 4px;}
        .sub{color:#6b8a9a;font-size:14px;margin-bottom:12px;}
        .location{background:#e8f5e9;border-left:4px solid #4caf50;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#2e7d32;}
        .location.loading{color:#757577;}
        .error{background:#ffebee;border-left:4px solid #f44336;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#c62828;}
        .store{background:#f8fafc;border-radius:14px;padding:16px 20px;margin-bottom:10px;border:1px solid rgba(0,0,0,0.04);display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
        .store:hover{background:#edf3f8;}
        .store .name{font-weight:600;color:#1a2a3a;}
        .store .addr{font-size:13px;color:#6b8a9a;}
        .store .dist{font-size:12px;color:#2ecc71;}
        .store .tag{background:rgba(26,122,138,0.08);color:#1a7a8a;padding:2px 12px;border-radius:12px;font-size:12px;}
        .empty{text-align:center;color:#9ab0c0;padding:30px 0;}
        .disclaimer{background:#fff3cd;color:#856404;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;border-left:4px solid #ffeeba;}
        .loading-more{color:#6b8a9a;padding:20px;text-align:center;}
    </style>
</head>
<body>
<div class="container">
    <div class="disclaimer">💡 本页面为产品演示，药品购买为模拟功能，不涉及真实交易</div>
    <a href="/" class="back">← 返回</a>
    <h1>💊 附近药店</h1>
    <p class="sub">搜索：<strong id="drug-name">药品</strong></p>
    <div id="location" class="location loading">📍 正在获取您的位置...</div>
    <div id="store-list"><div class="loading-more">📍 正在加载附近药店列表...</div></div>
</div>
<script>
    var drug = new URLSearchParams(window.location.search).get('drug') || '药品';
    document.getElementById('drug-name').textContent = drug;

    // 高德地图 API Key（从 Flask 模板注入）
    var GAODE_API_KEY = '{{ GAODE_API_KEY }}';
    if (GAODE_API_KEY === 'YOUR_API_KEY_HERE' || GAODE_API_KEY === '') {
        console.warn('⚠️ 高德 API Key 未配置，请设置环境变量 GAODE_API_KEY');
    }

    var locationDiv = document.getElementById('location');
    var storeListDiv = document.getElementById('store-list');

    // 将高德周边搜索结果转换为内部格式
    function convertPoisToStores(pois) {
        return pois.map(function(poi) {
            var distance = poi.distance || 0;
            var distText = distance < 1000 ? distance + '米' : (distance / 1000).toFixed(1) + 'km';
            // 高德返回的经纬度顺序是 lng,lat，需要转换
            return {
                name: poi.name || '未知药店',
                addr: poi.address || '地址不详',
                dist: distText,
                has: true,  // 因为无法实时判断是否有药，默认显示有药
                tel: poi.tel || '暂无电话',
                _raw: poi  // 保留原始数据用于调试
            };
        });
    }

    // 渲染药店列表
    function renderStores(stores) {
        if (!stores || stores.length === 0) {
            storeListDiv.innerHTML = '<div class="empty">附近暂无药店</div>';
            return;
        }

        // 排序：1. 有药的在前；2. 同状态下按距离从近到远
        var sorted = stores.sort(function(a,b) {
            if (a.has === b.has) {
                var distA = parseFloat(a.dist);
                var distB = parseFloat(b.dist);
                return distA - distB;
            }
            return a.has ? -1 : 1;
        });

        var html = '';
        sorted.forEach(function(s) {
            var tag = s.has ? '<span class="tag">✅ 有此药</span>' : '<span class="tag" style="color:#9ab0c0;">❌ 暂无</span>';
            html += '<div class="store" onclick="window.location.href=\'/pharmacy_detail?store='+encodeURIComponent(s.name)+'&drug='+encodeURIComponent(drug)+'\'">'
                + '<div><div class="name">'+s.name+'</div><div class="addr">'+s.addr+'</div><div class="dist">📍 '+s.dist+'</div></div>'
                + '<div style="text-align:right;">'+tag+'<div style="font-size:18px;color:#9ab0c0;">→</div></div>'
                + '</div>';
        });
        storeListDiv.innerHTML = html;
    }

    // 调用高德周边搜索 API 获取药店
    function searchNearbyPharmacies(lat, lon) {
        storeListDiv.innerHTML = '<div class="loading-more">🔍 正在搜索附近药店...</div>';

        // 方法1：使用类型搜索（0601 代表药店 - 医疗服务下的药店类型）
        var url1 = 'https://restapi.amap.com/v5/place/around?' +
                  'location=' + lon + ',' + lat + '&radius=3000&' +
                  'types=0601&key=' + GAODE_API_KEY + '&output=json';

        // 方法2：备用关键字搜索（如果类型搜索失败或无结果）
        var url2 = 'https://restapi.amap.com/v5/place/text?' +
                  'keyword=药店&near=' + lon + ',' + lat + '&radius=3000&' +
                  'key=' + GAODE_API_KEY + '&output=json';

        console.log('周边搜索 API URL (类型):', url1);
        console.log('周边搜索 API URL (关键字):', url2);

        // 优先使用类型搜索
        fetch(url1)
            .then(response => response.json())
            .then(function(data) {
                console.log('类型搜索 API 返回:', data);

                // v5 API 返回 status: "1" 表示成功，v3 也是 "1"
                // 检查 status 为 "1" 或 "ok"，且有 pois 数据
                if ((data.status === '1' || data.status === 'ok') && data.pois && data.pois.length > 0) {
                    var stores = convertPoisToStores(data.pois);
                    console.log('找到 ' + stores.length + ' 家药店（类型搜索）');
                    renderStores(stores);

                    // 更新位置信息为显示搜索到的药店数量
                    if (locationDiv.textContent.includes('已授权定位')) {
                        locationDiv.textContent = locationDiv.textContent + ' 📍 附近搜索到 ' + stores.length + ' 家药店';
                    }
                    return;
                }

                // 类型搜索失败或无结果，尝试关键字搜索
                console.warn('类型搜索无结果或失败，尝试关键字搜索...');
                fetch(url2)
                    .then(function(keywordResponse) {
                        return keywordResponse.json();
                    })
                    .then(function(keywordData) {
                        console.log('关键字搜索 API 返回:', keywordData);

                        // 检查 status 为 "1" 或 "ok"，且有 pois 数据
                        if ((keywordData.status === '1' || keywordData.status === 'ok') && keywordData.pois && keywordData.pois.length > 0) {
                            var stores = convertPoisToStores(keywordData.pois);
                            console.log('找到 ' + stores.length + ' 家药店（关键字搜索）');
                            renderStores(stores);
                            if (locationDiv.textContent.includes('已授权定位')) {
                                locationDiv.textContent = locationDiv.textContent + ' 📍 附近搜索到 ' + stores.length + ' 家药店';
                            }
                        } else {
                            // 两个搜索都失败，回退到模拟数据
                            console.warn('所有搜索方式均失败，回退模拟数据');
                            loadStoresFromMockData();
                        }
                    })
                    .catch(function(keywordErr) {
                        console.error('关键字搜索失败:', keywordErr);
                        loadStoresFromMockData();
                    });
            })
            .catch(function(typeErr) {
                console.error('类型搜索 API 调用失败:', typeErr);
                // 类型搜索失败，尝试关键字搜索
                fetch(url2)
                    .then(function(keywordResponse) {
                        return keywordResponse.json();
                    })
                    .then(function(keywordData) {
                        console.log('关键字搜索备用结果:', keywordData);

                        // 检查 status 为 "1" 或 "ok"，且有 pois 数据
                        if ((keywordData.status === '1' || keywordData.status === 'ok') && keywordData.pois && keywordData.pois.length > 0) {
                            var stores = convertPoisToStores(keywordData.pois);
                            console.log('找到 ' + stores.length + ' 家药店（关键字搜索备用）');
                            renderStores(stores);
                        } else {
                            loadStoresFromMockData();
                        }
                    })
                    .catch(function(keywordErr2) {
                        console.error('关键字搜索也失败:', keywordErr2);
                        loadStoresFromMockData();
                    });
            });
    }

    // 使用模拟数据（回退方案）
    function loadStoresFromMockData() {
        var stores = [
            {name:'仁心大药房',addr:'天河区中山大道100号',dist:'0.3km',has:true},
            {name:'健民药店',addr:'天河区黄埔大道西200号',dist:'0.8km',has:true},
            {name:'百姓大药房',addr:'天河区天河北路150号',dist:'1.2km',has:false},
            {name:'康泰药店',addr:'天河区体育西路50号',dist:'1.8km',has:true},
            {name:'九州通大药房',addr:'天河区五山路200号',dist:'2.8km',has:true},
        ];
        console.log('使用回退模拟药店数据');
        renderStores(stores);
    }

    // 逆地理编码获取地址（保持原有逻辑）
    function getFormattedAddress(lat, lon) {
        return new Promise(function(resolve, reject) {
            var url = 'https://rest.amap.com/v3/geocode/regeo?key=' + GAODE_API_KEY +
                     '&location=' + lon + ',' + lat + '&extensions=all';

            fetch(url)
                .then(response => response.json())
                .then(function(data) {
                    console.log('逆地理编码 API 返回:', data);
                    if (data.status === '1' && data.regeocode && data.regeocode.formatted_address) {
                        resolve(data.regeocode.formatted_address);
                    } else if (data.status === '1' && data.regeoCode && data.regeoCode.address) {
                        resolve(data.regeoCode.address);
                    } else if (data.regeocode && data.regeocode.address) {
                        resolve(data.regeocode.address);
                    } else {
                        resolve('地址解析中...');
                    }
                })
                .catch(function(err) {
                    console.error('逆地理编码失败:', err);
                    resolve('定位中...');
                });
        });
    }

    // 主流程：定位 -> 获取地址 -> 搜索药店
    if (navigator.geolocation) {
        locationDiv.textContent = '📍 正在获取您的位置...';

        navigator.geolocation.getCurrentPosition(function(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            console.log('获取到坐标:', lat, lon);

            locationDiv.textContent = '📍 正在获取地址...';

            // 同时发起地址解析和药店搜索
            getFormattedAddress(lat, lon).then(function(address) {
                locationDiv.textContent = '📍 您的位置：' + address + '（已授权定位）';
                locationDiv.className = 'location';
            });

            searchNearbyPharmacies(lat, lon);

        }, function(error) {
            var errorMsg = '';
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    errorMsg = '用户拒绝授权位置获取';
                    locationDiv.textContent = '⚠️ 未获取到位置权限，将使用默认位置：广州市天河区';
                    locationDiv.className = 'location error';
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorMsg = '位置信息不可用';
                    locationDiv.textContent = '⚠️ 位置信息不可用，将使用默认位置：广州市天河区';
                    locationDiv.className = 'location error';
                    break;
                case error.TIMEOUT:
                    errorMsg = '定位超时';
                    locationDiv.textContent = '⚠️ 定位超时，将使用默认位置：广州市天河区';
                    locationDiv.className = 'location error';
                    break;
            }
            loadStoresFromMockData();
        });
    } else {
        locationDiv.textContent = '❌ 您的浏览器不支持地理位置定位，将使用默认位置：广州市天河区';
        locationDiv.className = 'location error';
        loadStoresFromMockData();
    }
</script>
</body>
</html>
